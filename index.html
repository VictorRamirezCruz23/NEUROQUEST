<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="screen-orientation" content="landscape" />
  <title>NEUROQUEST — Aventura Educativa Adaptativa</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <div id="app">
    <div id="game-container"></div>
    
    <!-- Modal de Autenticación y Perfil de Cadete (Firebase Auth) -->
    <div id="auth-modal" class="auth-modal-overlay" style="display: none;">
      <div class="auth-box">
        <button id="auth-modal-close" class="auth-close-btn" aria-label="Cerrar">&times;</button>
        <div class="auth-header">
          <span class="auth-badge">NEUROCORE ID</span>
          <h2 id="auth-title">IDENTIFICACIÓN DE CADETE</h2>
          <p id="auth-subtitle">Sincronización en la nube con Firebase</p>
        </div>

        <div id="auth-status-panel" class="auth-status-panel">
          <div class="auth-status-row">
            <span class="auth-label">Estado:</span>
            <span id="auth-user-status" class="auth-val">Conectando con Firebase...</span>
          </div>
          <div class="auth-status-row">
            <span class="auth-label">ID Registro:</span>
            <span id="auth-user-uid" class="auth-val font-mono">---</span>
          </div>
        </div>

        <!-- Botón de Inicio con Google -->
        <button type="button" id="auth-btn-google" class="auth-google-btn">
          <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>CONTINUAR CON GOOGLE</span>
        </button>

        <div class="auth-divider">
          <span>O CON CORREO ESCOLAR</span>
        </div>

        <!-- Formulario de Inicio de Sesión / Registro -->
        <form id="auth-form" class="auth-form">
          <div class="auth-field" id="field-displayname" style="display: none;">
            <label for="auth-input-name">Nombre de Cadete</label>
            <input type="text" id="auth-input-name" placeholder="Ej. Cadete Nova" autocomplete="name" />
          </div>

          <div class="auth-field">
            <label for="auth-input-email">Correo Electrónico</label>
            <input type="email" id="auth-input-email" placeholder="estudiante@escuela.edu" required autocomplete="email" />
          </div>

          <div class="auth-field">
            <label for="auth-input-password">Contraseña</label>
            <input type="password" id="auth-input-password" placeholder="Mínimo 6 caracteres" required autocomplete="current-password" />
          </div>

          <div id="auth-error-msg" class="auth-error" style="display: none;"></div>
          <div id="auth-success-msg" class="auth-success" style="display: none;"></div>

          <div class="auth-actions">
            <button type="submit" id="auth-btn-submit" class="auth-primary-btn">INICIAR SESIÓN</button>
            <button type="button" id="auth-btn-switch" class="auth-secondary-btn">¿No tienes cuenta? Regístrate</button>
            <button type="button" id="auth-btn-anon" class="auth-ghost-btn">Jugar como Cadete Invitado</button>
            <button type="button" id="auth-btn-logout" class="auth-danger-btn" style="display: none;">Cerrar Sesión</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Aviso de orientación forzada para móviles en modo vertical -->
    <div id="rotate-device-overlay" class="rotate-overlay">
      <div class="rotate-box">
        <div class="rotate-icon">📱 ➔ 🔄 ➔ 📲</div>
        <h2>GIRA TU DISPOSITIVO</h2>
        <p>NEUROQUEST requiere orientación horizontal (Landscape) para una experiencia óptima.</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
